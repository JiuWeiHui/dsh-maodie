# ============================================================================
# 耄耋 (maodie) —— DSH bundle patch
# ============================================================================
# 这是插件的「挂载声明」。DSH 启动时按 bundle 层栈叠加各插件 patch，
# 本文件把「耄耋」这一行插入 profile 的配置树。
#
# 安装（0.2 桌面版）——不要再用旧 README 里那套「手改 package.json + 重启」，
# 官方路径是 plugin_manager 服务：
#   · 会话里（推荐）：plugin_manager { action: "install_bundle",
#       target: "link:C:/Users/rennanchuan/.dsh/local-plugins/maodie" }
#     HMR 打开时 bundle 选择会即时生效，不需要重启 DSH。
#   · 应用里：侧栏 → Plugins → Add plugin → 填插件绝对路径。
#   · CLI：dsh plugin --profile desktop … 会被拒绝（desktop profile 由桌面端独占）。
#
# 注意：安装/替换的是**配置**，即时生效；但注入到主窗口的那张 index 注入表
# 由 Electron 壳在 Host 启动时收集一次，所以「第一次装好」需要重启桌面端一次，
# 之后改前端脚本只要刷新页面。
# ============================================================================

- insert:
    - id: maodie
      name: maodie
